---
# =============================================================================
# 클린 teardown — 재테스트를 위해 배포물을 지운다.
# -----------------------------------------------------------------------------
# ⚠ 되돌릴 수 없다. 메타DB 스키마·DAG·로그·설정이 사라진다.
#   그래서 확인 변수 없이는 아무것도 하지 않는다:
#
#   # ① Airflow 만 제거 (기본) — Patroni 클러스터는 건드리지 않는다
#   ansible-playbook playbooks/teardown.yml -e teardown_confirm=yes
#
#   # ② Airflow + 패키지까지
#   ansible-playbook playbooks/teardown.yml -e teardown_confirm=yes \
#     -e teardown_remove_packages=true
#
#   # ③ 랩 완전 초기화 — Patroni/etcd/pgbouncer/keepalived 까지 전부
#   ansible-playbook playbooks/teardown.yml -e teardown_confirm=yes \
#     -e teardown_remove_packages=true -e teardown_include_patroni=true
#
# ⚠ ansible_python_interpreter 를 시스템 python3 로 고정한다.
#   자동탐지는 python3.11 을 고르는데 이 플레이북이 그 패키지를 지울 수 있어,
#   실행 도중 자기 발밑이 무너진다.
#
# 남기는 것(의도적):
#   - 사내 미러 repo(local-*)  : 지우면 재설치가 불가능해진다. PGDG repo 만 제거.
#   - gcc/make/tar/rsync 등     : 이 스택 전용이 아닌 범용 OS 도구.
# =============================================================================

- name: 클린 teardown
  hosts: airflow_cluster
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    teardown_confirm: "no"
    teardown_remove_packages: false
    teardown_include_patroni: false
    # 완전 초기화에서 VIP 를 회수할 인터페이스(Patroni 프로젝트의 vip_interface 와 동일)
    teardown_vip_interface: enp1s0

    _airflow_units:
      - airflow-api-server
      - airflow-scheduler
      - airflow-dag-processor
      - airflow-triggerer
      - airflow-worker
      - airflow-flower
      - airflow-haproxy
      - redis
      - redis-sentinel
    _patroni_units: [patroni, etcd, pgbouncer, haproxy, keepalived]
    _airflow_packages: [redis, python3.11, python3.11-pip, python3.11-devel]
    _patroni_packages:
      - patroni
      - patroni-etcd
      - etcd
      - pgbouncer
      - haproxy
      - keepalived
      - python3-psycopg2
      - postgresql16
      - postgresql16-server
      - postgresql16-contrib

  tasks:
    - name: 확인 변수 없이는 실행 거부
      ansible.builtin.assert:
        that: teardown_confirm | string | lower in ['yes', 'true']
        fail_msg: >-
          이 플레이북은 데이터를 영구 삭제합니다.
          의도가 확실하면 -e teardown_confirm=yes 를 붙여 다시 실행하세요.
        success_msg: "teardown 시작 (패키지 제거={{ teardown_remove_packages }}, Patroni 포함={{ teardown_include_patroni }})"
      run_once: true

    # --- 1) 서비스 중지 ------------------------------------------------------
    - name: 서비스 중지/비활성
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ _airflow_units + (_patroni_units if teardown_include_patroni | bool else []) }}"
      failed_when: false

    - name: systemd 유닛 파일 제거
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: absent
      loop:
        - airflow-api-server.service
        - airflow-scheduler.service
        - airflow-dag-processor.service
        - airflow-triggerer.service
        - airflow-worker.service
        - airflow-flower.service
        - airflow-haproxy.service
        - airflow.env

    - name: systemd 재로드
      ansible.builtin.systemd:
        daemon_reload: true

    # --- 2) 패키지 제거 ------------------------------------------------------
    # 설정/데이터 삭제보다 먼저 한다. 패키지 삭제 스크립틀릿이 설정파일을 참조하는 경우
    # 이미 지워져 있으면 오류가 나기 때문.
    - name: 스택 패키지 제거
      ansible.builtin.dnf:
        name: "{{ _airflow_packages + (_patroni_packages if teardown_include_patroni | bool else []) }}"
        state: absent
        autoremove: false
      when: teardown_remove_packages | bool
      failed_when: false

    - name: 남은 관련 패키지 확인
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          rpm -qa | grep -iE '^({{ _pat }})' || true
        executable: /bin/bash
      vars:
        _pat: "{{ 'postgresql|patroni|etcd|pgbouncer|haproxy|keepalived|redis|python3\\.11' if teardown_include_patroni | bool else 'redis|python3\\.11' }}"
      register: _leftover
      changed_when: false
      when: teardown_remove_packages | bool

    - name: 남은 패키지 강제 제거
      ansible.builtin.command:
        cmd: dnf -y remove {{ _leftover.stdout_lines | join(' ') }}
      when:
        - teardown_remove_packages | bool
        - _leftover.stdout_lines | default([]) | length > 0
      changed_when: true
      failed_when: false

    # --- 3) 데이터/설정 삭제 -------------------------------------------------
    - name: Airflow 데이터·설정 삭제
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ airflow_home }}"
        - "{{ airflow_stage_dir }}"
        - "{{ airflow_lb_config }}"
        - /run/airflow-haproxy.pid
        - /run/airflow-haproxy.sock
        - "{{ redis_include_conf }}"
        - "{{ redis_sentinel_conf }}"
        - /var/lib/redis
        - /var/log/redis

    - name: Patroni 스택 데이터·설정 삭제
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/patroni
        - /var/lib/postgresql
        - /var/lib/pgsql
        - /var/log/postgresql
        - /etc/etcd
        - /var/lib/etcd
        - /etc/pgbouncer
        - /var/log/pgbouncer
        - /etc/haproxy
        - /etc/keepalived
        - /etc/redis
        - /run/haproxy.pid
      when: teardown_include_patroni | bool

    - name: PGDG repo 제거 (사내 미러 repo 는 보존)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ls /etc/yum.repos.d/pgdg*.repo 2>/dev/null | xargs -r rm -f
          dnf clean all >/dev/null 2>&1 || true
          echo done
        executable: /bin/bash
      when: teardown_include_patroni | bool
      changed_when: true
      failed_when: false

    # --- 4) 계정 제거 --------------------------------------------------------
    - name: 서비스 계정·그룹 제거
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
        remove: false          # 홈은 위에서 이미 삭제했다
        force: true
      loop: "{{ [airflow_user, 'redis'] + (['postgres', 'pgbouncer', 'etcd', 'haproxy'] if teardown_include_patroni | bool else []) }}"
      failed_when: false

    - name: 그룹 제거
      ansible.builtin.group:
        name: "{{ item }}"
        state: absent
      loop: "{{ [airflow_group, 'redis'] + (['postgres', 'pgbouncer', 'etcd', 'haproxy'] if teardown_include_patroni | bool else []) }}"
      failed_when: false

    # --- 5) 네트워크/보안 흔적 정리 -----------------------------------------
    - name: VIP 가 남아 있으면 회수
      ansible.builtin.command:
        cmd: ip addr del {{ airflow_cluster_vip }}/24 dev {{ teardown_vip_interface }}
      register: _vip
      changed_when: _vip.rc == 0
      failed_when: false
      when: teardown_include_patroni | bool

    - name: firewalld 포트 규칙 제거
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        immediate: true
        state: disabled
      loop: >-
        {{ [airflow_lb_port, airflow_lb_stats_port, airflow_api_port,
            airflow_worker_log_port, redis_port, redis_sentinel_port]
           + ([5000, 5001, 5432, 6432, 7000, 8008, 2379, 2380] if teardown_include_patroni | bool else []) }}
      failed_when: false

    - name: firewalld rich rule 제거
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          firewall-cmd --list-rich-rules 2>/dev/null | while read -r r; do
            [ -n "$r" ] && firewall-cmd --permanent --remove-rich-rule="$r" >/dev/null 2>&1 || true
          done
          firewall-cmd --reload >/dev/null 2>&1 || true
          echo done
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: /etc/hosts 에 등록한 클러스터 항목 제거
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^{{ hostvars[item].node_ip | regex_escape }}\s'
        state: absent
      loop: "{{ groups['airflow_cluster'] }}"

    - name: SELinux boolean 원복
      ansible.posix.seboolean:
        name: haproxy_connect_any
        state: false
        persistent: true
      failed_when: false

    # --- 6) 검증 -------------------------------------------------------------
    - name: 잔여 확인
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          echo "패키지=$(rpm -qa | grep -icE '^(postgresql|patroni|etcd|pgbouncer|haproxy|keepalived|redis|python3\.11)')"
          echo "디렉터리=$(ls -d {{ airflow_home }} {{ airflow_stage_dir }} /etc/patroni /var/lib/postgresql /etc/redis /var/lib/etcd 2>/dev/null | wc -l)"
          echo "유닛=$(ls /etc/systemd/system/airflow-* 2>/dev/null | wc -l)"
          echo "리스닝=$(ss -lntH | awk '{print $4}' | tr '\n' ' ')"
        executable: /bin/bash
      register: _verify
      changed_when: false

    - name: 결과
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} → {{ _verify.stdout_lines }}"
