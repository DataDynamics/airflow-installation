---
# 실제 서버를 건드리기 전에 토폴로지·산출물·의존 서비스를 검증한다.
# 여기서 막지 못하면 절반만 배포된 상태로 실패한다.

- name: Sentinel 노드는 홀수 + 최소 3대여야 함 (정족수)
  ansible.builtin.assert:
    that:
      - groups['redis_sentinel'] | default([]) | length >= 3
      - (groups['redis_sentinel'] | length) % 2 == 1
    fail_msg: >-
      redis_sentinel 그룹은 홀수·최소 3대여야 합니다
      (현재 {{ groups['redis_sentinel'] | default([]) | length }}대).
      짝수면 정족수를 만들지 못해 브로커 자동 페일오버가 멈춥니다.
    success_msg: "Sentinel 노드 수 정상: {{ groups['redis_sentinel'] | length }}대"
  run_once: true
  delegate_to: localhost

- name: Redis 초기 master 는 정확히 1대여야 함
  ansible.builtin.assert:
    that:
      - >-
        groups['airflow_cluster']
        | map('extract', hostvars, 'redis_initial_role')
        | select('equalto', 'master') | list | length == 1
    fail_msg: "인벤토리에서 redis_initial_role=master 인 호스트가 정확히 1대가 아닙니다."
  run_once: true
  delegate_to: localhost

- name: 공유 비밀(vault)이 채워졌는지 확인
  ansible.builtin.assert:
    that:
      - vault_fernet_key is defined and 'CHANGE_ME' not in vault_fernet_key
      - vault_api_secret_key is defined and 'CHANGE_ME' not in vault_api_secret_key
      - vault_jwt_secret is defined and 'CHANGE_ME' not in vault_jwt_secret
      - vault_db_password is defined and 'CHANGE_ME' not in vault_db_password
      - vault_redis_password is defined and 'CHANGE_ME' not in vault_redis_password
      - vault_admin_password is defined and 'CHANGE_ME' not in vault_admin_password
    fail_msg: "vault 값이 비었거나 CHANGE_ME 입니다 — scripts/gen-vault.sh 를 먼저 실행하세요."
  run_once: true
  delegate_to: localhost
  no_log: true

- name: airgap 번들 존재 확인
  ansible.builtin.stat:
    path: "{{ airflow_bundle_src }}"
  register: _bundle
  run_once: true
  delegate_to: localhost
  become: false

- name: 번들이 없으면 중단
  ansible.builtin.assert:
    that: [_bundle.stat.exists]
    fail_msg: >-
      번들 없음: {{ airflow_bundle_src }}
      — 빌드머신에서 build/package.sh 를 먼저 실행하세요.
  run_once: true
  delegate_to: localhost

- name: python3.11 존재 확인 (Airflow 3.2+ 는 3.10 미만 미지원)
  ansible.builtin.stat:
    path: "{{ airflow_python }}"
  register: _py

# 없다고 여기서 죽이면 안 된다 — python3.11 은 1단계(airflow_common)가 dnf 로 설치한다.
# 특히 teardown -e teardown_remove_packages=true 는 이 패키지를 지우므로,
# 하드 실패로 두면 teardown → 재배포 루프가 항상 0단계에서 막힌다.
# 대신 '지금 구할 수 있는지'를 확인한다. repo 에 없으면 1단계에서 어차피 실패하는데,
# 그때는 계정·디렉터리를 이미 만든 뒤라 절반만 배포된 상태가 된다.
- name: python3.11 이 repo 에서 설치 가능한지 확인
  ansible.builtin.command:
    cmd: dnf -q list --available {{ airflow_python | basename }}
  register: _py_avail
  changed_when: false
  failed_when: false
  when: not _py.stat.exists

- name: python3.11 을 구할 수 없으면 중단
  ansible.builtin.assert:
    that: _py.stat.exists or (_py_avail.rc | default(1)) == 0
    fail_msg: >-
      {{ inventory_hostname }}: {{ airflow_python }} 도 없고 repo 에서도 찾을 수 없습니다 —
      RHEL 9 AppStream(또는 사내 미러)에 python3.11 이 보이는지 확인하세요:
      `dnf list --available python3.11`
    success_msg: >-
      {{ inventory_hostname }}: {{ 'python3.11 설치됨'
         if _py.stat.exists else 'python3.11 미설치 — 1단계에서 repo 로부터 설치합니다' }}

- name: 메타DB 백엔드 값 확인
  ansible.builtin.assert:
    that: airflow_db_backend in ['patroni', 'external']
    fail_msg: "airflow_db_backend 는 patroni 또는 external 이어야 합니다 (현재: {{ airflow_db_backend }})."
    success_msg: "메타DB 백엔드 = {{ airflow_db_backend }}"
  run_once: true
  delegate_to: localhost

# patroni 백엔드는 patroni_cluster 그룹과 REST 도달성이 전제다.
- name: patroni 백엔드인데 patroni_cluster 그룹이 없으면 중단
  ansible.builtin.assert:
    that: (groups['patroni_cluster'] | default([])) | length > 0
    fail_msg: >-
      airflow_db_backend=patroni 인데 인벤토리에 patroni_cluster 그룹이 없습니다.
      Patroni 를 쓰지 않는 환경이면 airflow_db_backend=external 로 두고
      airflow_db_external_host 를 지정하세요.
  run_once: true
  delegate_to: localhost
  when: airflow_db_backend == 'patroni'

- name: Patroni REST 응답 확인 (메타DB 의존성)
  ansible.builtin.uri:
    url: "http://{{ node_ip }}:{{ patroni_rest_port }}/health"
    status_code: [200, 503]
    timeout: 5
  register: _patroni
  when:
    - airflow_db_backend == 'patroni'
    - inventory_hostname in (groups['patroni_cluster'] | default([]))

- name: external 백엔드인데 엔드포인트가 비었으면 중단
  ansible.builtin.assert:
    that: airflow_db_external_host | default('') | length > 0
    fail_msg: >-
      airflow_db_backend=external 에는 airflow_db_external_host 가 필요합니다
      (RW 로 붙을 수 있는 주소 — 단일 서버 IP·HA VIP·관리형 DB 엔드포인트).
  run_once: true
  delegate_to: localhost
  when: airflow_db_backend == 'external'

- name: 외부 메타DB 엔드포인트 도달 확인 (전 노드에서)
  ansible.builtin.wait_for:
    host: "{{ airflow_db_external_host }}"
    port: "{{ airflow_db_external_port }}"
    timeout: 10
  when: airflow_db_backend == 'external'

- name: 이미 배포된 노드인지 판별 (재실행 여부)
  ansible.builtin.stat:
    path: /etc/systemd/system/airflow-api-server.service
  register: _installed

- name: Airflow 가 쓸 포트가 이미 점유되어 있지 않은지 확인
  # api-server(8081) / LB(8080) / LB stats(7001) / 워커 로그(8793).
  # Patroni 쪽 HAProxy 가 5000/5001/7000 을 쓰므로 겹치면 안 된다.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      ss -lntH "sport = :{{ item }}" | awk '{print $4}' | head -1
    executable: /bin/bash
  register: _port_check
  changed_when: false
  when: not _installed.stat.exists
  # 메타DB 프록시 포트는 그 리스너를 실제로 띄울 때만 본다. external 백엔드에서는
  # airflow_db_port 가 '남의 DB 서버 포트'(보통 5432)라, 이 노드에서 점유 검사를 하면
  # PostgreSQL 이 같이 도는 구성에서 엉뚱하게 충돌로 판정된다.
  loop: >-
    {{ [airflow_lb_port, airflow_lb_stats_port, airflow_api_port, airflow_worker_log_port]
       + ([airflow_db_port] if airflow_db_proxy_enabled | bool else []) }}

- name: 포트 충돌이면 중단 (이미 우리 서비스가 쓰는 중이면 무시)
  ansible.builtin.assert:
    that: item.stdout | length == 0
    fail_msg: >-
      {{ inventory_hostname }}: 포트 {{ item.item }} 가 이미 점유되어 있습니다
      ({{ item.stdout }}). group_vars 에서 포트를 바꾸거나 기존 프로세스를 정리하세요.
  loop: "{{ _port_check.results | default([]) }}"
  loop_control:
    label: "port {{ item.item }}"
  # 재실행에서는 우리 서비스가 그 포트를 쓰고 있는 게 정상이므로 검사하지 않는다.
  when: not _installed.stat.exists
