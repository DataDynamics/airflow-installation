---
# Sentinel 자체에도 인증을 건다. firewalld 로 대역을 막더라도 브로커 제어
# 채널을 열어두지 않기 위함. 끄면 airflow.cfg 의 sentinel_kwargs 도 함께 빠진다.
redis_sentinel_auth_enabled: true

# 인벤토리에서 redis_initial_role=master 로 지정된 호스트 — 최초 부트스트랩에만 쓴다.
# 이후 master 결정권은 Sentinel 에 있고 이 값은 무시된다.
_redis_initial_master: >-
  {{ groups['airflow_cluster']
     | map('extract', hostvars)
     | selectattr('redis_initial_role', 'defined')
     | selectattr('redis_initial_role', 'equalto', 'master')
     | map(attribute='inventory_hostname') | first }}

# sentinel.conf 를 강제로 다시 쓸 때만 true (Sentinel 이 학습한 상태가 초기화된다).
redis_sentinel_force_rewrite: false

redis_maxmemory_policy: noeviction   # 브로커는 절대 evict 하면 안 된다(태스크 유실)

# Sentinel 대상 redis-cli 호출용 환경. 인증을 끄면 REDISCLI_AUTH 자체를 넘기지 않는다
# (빈 값을 넘기면 redis-cli 가 AUTH 를 보내 'no password is set' 오류가 난다).
# environment 에서는 omit 이 안전하게 처리되지 않으므로 dict 를 통째로 만든다.
_sentinel_cli_env: >-
  {{ {'REDISCLI_AUTH': vault_redis_password} if (redis_sentinel_auth_enabled | bool) else {} }}
