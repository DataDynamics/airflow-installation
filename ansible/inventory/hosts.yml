---
# =============================================================================
# Airflow 3.x HA — 3노드 대칭 클러스터 인벤토리
# =============================================================================
# 이 노드들은 Patroni PostgreSQL HA 클러스터(pg-ha-cluster)와 동일한 VM 이다.
# Airflow 는 Patroni 의 존재를 모르고 VIP:5000(HAProxy RW) 하나만 바라본다.
#
#   airflow_cluster : Airflow 전 서비스(api-server/scheduler/dag-processor/
#                     triggerer/celery worker)를 돌리는 노드. 대칭 구성.
#   redis_sentinel  : Celery 브로커 HA. 홀수 필수(quorum). 보통 airflow_cluster 와 동일.
#   airflow_lb      : Airflow UI 앞단 HAProxy. Patroni 의 haproxy.cfg 와 분리된
#                     전용 인스턴스(airflow-haproxy.service)를 돌린다.
#
# 호스트 변수:
#   node_ip            : 피어/클라이언트에 광고할 IP (전 노드 필수)
#   redis_initial_role : master | replica — 최초 1회 부트스트랩에만 사용.
#                        이후 master 결정권은 Sentinel 에 있다.
# =============================================================================

all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519

  children:
    airflow_cluster:
      hosts:
        pg-node-1:
          ansible_host: 192.168.122.101
          node_ip: 192.168.122.101
          redis_initial_role: master
        pg-node-2:
          ansible_host: 192.168.122.102
          node_ip: 192.168.122.102
          redis_initial_role: replica
        pg-node-3:
          ansible_host: 192.168.122.103
          node_ip: 192.168.122.103
          redis_initial_role: replica

    redis_sentinel:
      hosts:
        pg-node-1:
        pg-node-2:
        pg-node-3:

    airflow_lb:
      hosts:
        pg-node-1:
        pg-node-2:
        pg-node-3:

    # Patroni 클러스터 노드 — Leader 탐색(REST :8008)과 DB 부트스트랩 위임 대상.
    # ⚠ airflow_db_backend=patroni 일 때만 쓰인다(기본). Patroni 가 아닌 PostgreSQL 을
    #   쓴다면 이 그룹은 통째로 지우고 group_vars 에서 backend 를 바꾼다:
    #     airflow_db_backend: external
    #     airflow_db_external_host: <RW 엔드포인트>
    #   여기서는 airflow_cluster 와 동일 노드지만, DB 노드를 분리하면 이 그룹만 바꾸면 된다.
    patroni_cluster:
      hosts:
        pg-node-1:
        pg-node-2:
        pg-node-3:
