---
# Airflow UI 관리자 비밀번호를 vault 값(vault_admin_password)으로 재설정한다.
#
# 계정이 이미 있으면 site.yml 의 'users create' 는 건너뛰므로 비밀번호가 그대로 남는다.
# vault 값을 바꾼 뒤에는 이 플레이북을 한 번 돌려야 실제로 반영된다.
#
#   ansible-vault edit group_vars/all/vault.yml     # vault_admin_password 수정
#   ansible-playbook playbooks/reset-admin-password.yml
#
# patroni_cluster 를 포함해야 airflow_db role 이 Leader 를 탐색할 수 있다.
- name: 관리자 비밀번호 재설정
  hosts: airflow_cluster:patroni_cluster
  gather_facts: false
  vars:
    airflow_admin_reset_password: true
  roles:
    - airflow_db
