---
# Celery 브로커 HA — Redis master 1 + replica N + Sentinel.
#
# ⚠ Sentinel 은 자기 설정파일과 redis.conf 를 런타임에 '다시 씀'(CONFIG REWRITE).
#   따라서 매 실행마다 redis.conf 를 통째로 템플릿하면 Sentinel 이 승격시켜 둔
#   replicaof 상태를 되돌려 버린다. 그래서:
#     · 정적 설정(bind/auth 등)은 우리가 소유하는 include 파일에만 둔다
#     · redis.conf 본체는 include 한 줄만 lineinfile 로 추가한다
#     · replicaof 는 설정이 아니라 런타임 명령으로 1회만 부트스트랩한다
#     · sentinel.conf 는 '우리 설정이 없을 때만' 쓰고 이후엔 Sentinel 에 맡긴다
#
# redis-cli 인증은 -a 대신 REDISCLI_AUTH 환경변수로 넘긴다(대상 ps 노출 방지).

- name: redis 설정 디렉터리 확인
  ansible.builtin.stat:
    path: "{{ redis_conf }}"
  register: _rconf

- name: redis.conf 없으면 중단
  ansible.builtin.assert:
    that: _rconf.stat.exists
    fail_msg: "{{ redis_conf }} 없음 — redis 패키지 설치를 확인하세요."

- name: 정적 설정 include 파일 배치
  ansible.builtin.template:
    src: airflow-redis.conf.j2
    dest: "{{ redis_include_conf }}"
    owner: redis
    group: root
    mode: "0640"
  notify: restart redis

- name: redis.conf 에 include 등록 (마지막에 와야 우리 설정이 이긴다)
  ansible.builtin.lineinfile:
    path: "{{ redis_conf }}"
    line: "include {{ redis_include_conf }}"
    regexp: '^include\s+{{ redis_include_conf | regex_escape }}\s*$'
    insertafter: EOF
    state: present
    owner: redis
    group: root
    mode: "0640"
  notify: restart redis

- name: redis 기동
  ansible.builtin.systemd:
    name: redis
    enabled: true
    state: started
    daemon_reload: true

- name: 변경분 즉시 반영
  ansible.builtin.meta: flush_handlers

- name: redis 응답 대기
  ansible.builtin.wait_for:
    host: "{{ node_ip }}"
    port: "{{ redis_port }}"
    timeout: 30

# --- Sentinel 설정 -----------------------------------------------------------
- name: 우리 Sentinel 설정이 적용돼 있는지 확인
  # ⚠ 파일 존재 여부로 판단하면 안 된다 — redis 패키지가 stock sentinel.conf
  #   (mymaster 127.0.0.1 6379 감시)를 이미 설치해 두기 때문에 항상 '있음'이 되어
  #   우리 템플릿이 영원히 적용되지 않는다.
  #   '우리 master 이름이 들어 있는가'로 판단해야 최초 배치와 Sentinel 의 재작성을
  #   둘 다 올바르게 구분할 수 있다.
  ansible.builtin.command:
    cmd: grep -qE '^sentinel monitor {{ redis_sentinel_master_name }}\s' {{ redis_sentinel_conf }}
  register: _sentinel_configured
  changed_when: false
  failed_when: false

- name: sentinel.conf 배치 (우리 설정이 없을 때만 — 이후엔 Sentinel 이 소유)
  ansible.builtin.template:
    src: sentinel.conf.j2
    dest: "{{ redis_sentinel_conf }}"
    owner: redis
    group: root
    mode: "0640"
  when: (_sentinel_configured.rc != 0) or (redis_sentinel_force_rewrite | bool)
  notify: restart redis-sentinel

# sentinel.conf 는 '최초 1회만' 쓰기 때문에, 위 템플릿을 나중에 고쳐도 이미 배포된
# 노드에는 반영되지 않는다. 아래 항목들은 Sentinel 이 스스로 바꾸지 않는 '우리 소유'
# 정적 설정이므로 매 실행 강제해도 학습 상태(monitor/epoch/peer)를 훼손하지 않는다.
- name: sentinel.conf 정적 설정 강제 (bind / announce)
  ansible.builtin.lineinfile:
    path: "{{ redis_sentinel_conf }}"
    regexp: "{{ item.re }}"
    line: "{{ item.line }}"
    insertafter: '^port '
    owner: redis
    group: root
    mode: "0640"
  loop:
    - re: '^bind '
      line: "bind {{ node_ip }} 127.0.0.1"
    - re: '^sentinel announce-ip '
      line: "sentinel announce-ip {{ node_ip }}"
    - re: '^sentinel announce-port '
      line: "sentinel announce-port {{ redis_sentinel_port }}"
  loop_control:
    label: "{{ item.line.split(' ')[0:2] | join(' ') }}"
  register: _sentinel_static
  notify: restart redis-sentinel

- name: sentinel.conf requirepass 강제
  ansible.builtin.lineinfile:
    path: "{{ redis_sentinel_conf }}"
    regexp: '^requirepass '
    line: "requirepass {{ vault_redis_password }}"
    insertafter: '^port '
    owner: redis
    group: root
    mode: "0640"
    state: "{{ 'present' if redis_sentinel_auth_enabled | bool else 'absent' }}"
  register: _sentinel_pass
  no_log: true
  notify: restart redis-sentinel

- name: sentinel.conf auth-pass 강제 (master 접속 비밀번호)
  # ⚠ 이것도 최초 템플릿에만 있으면 안 된다. vault_redis_password 를 교체했는데
  #   sentinel 은 옛 비밀번호를 계속 써서 master 에 붙지 못하고, 그 결과
  #   페일오버가 조용히 죽는다(평소엔 아무 증상이 없다).
  # ⚠ 삽입 위치가 중요하다. Sentinel 은 'sentinel auth-pass <name>' 을 파싱할 때
  #   해당 이름의 master 가 이미 선언돼 있어야 한다. monitor 앞에 오면
  #   "No such master with specified name" 으로 기동 자체가 실패한다.
  #   그래서 insertafter 를 monitor 줄로 잡는다.
  ansible.builtin.lineinfile:
    path: "{{ redis_sentinel_conf }}"
    regexp: '^sentinel auth-pass {{ redis_sentinel_master_name }}\s'
    line: "sentinel auth-pass {{ redis_sentinel_master_name }} {{ vault_redis_password }}"
    insertafter: '^sentinel monitor {{ redis_sentinel_master_name }}\s'
    owner: redis
    group: root
    mode: "0640"
    state: "{{ 'present' if vault_redis_password | length > 0 else 'absent' }}"
  register: _sentinel_authpass
  no_log: true
  notify: restart redis-sentinel

- name: sentinel 기동
  ansible.builtin.systemd:
    name: redis-sentinel
    enabled: true
    state: started

# 설정을 새로 썼다면 여기서 반드시 재시작이 일어나야 한다.
# (이미 stock 설정으로 떠 있는 경우 systemd 'started' 는 no-op 이라 반영되지 않는다)
- name: Sentinel 재시작 반영
  ansible.builtin.meta: flush_handlers

- name: sentinel 응답 대기
  ansible.builtin.wait_for:
    host: "{{ node_ip }}"
    port: "{{ redis_sentinel_port }}"
    timeout: 30

- name: 잘못된 주소로 학습한 peer/replica 기록 초기화
  # bind/announce 를 고치기 전에 이미 서로를 127.0.0.1 로 기록해 두었다면 그대로 남는다.
  # RESET 은 monitor 설정만 남기고 학습분을 비워 올바른 주소로 다시 발견하게 한다.
  ansible.builtin.command:
    cmd: >-
      redis-cli -h 127.0.0.1 -p {{ redis_sentinel_port }}
      sentinel reset {{ redis_sentinel_master_name }}
  environment: "{{ _sentinel_cli_env }}"
  when: (_sentinel_static is changed) or (_sentinel_pass is changed) or (_sentinel_authpass is changed)
  changed_when: true
  no_log: true

- name: 재발견 대기
  ansible.builtin.pause:
    seconds: 15
  when: (_sentinel_static is changed) or (_sentinel_pass is changed) or (_sentinel_authpass is changed)
  run_once: true

# --- 복제 부트스트랩 (최초 1회) ----------------------------------------------
- name: Sentinel 이 이미 master 를 알고 있는지 확인
  ansible.builtin.command:
    cmd: >-
      redis-cli -h 127.0.0.1 -p {{ redis_sentinel_port }}
      sentinel get-master-addr-by-name {{ redis_sentinel_master_name }}
  environment: "{{ _sentinel_cli_env }}"
  register: _sentinel_master
  changed_when: false
  failed_when: false
  no_log: true

- name: 현재 복제 상태 조회
  ansible.builtin.command:
    cmd: redis-cli -h 127.0.0.1 -p {{ redis_port }} info replication
  environment:
    REDISCLI_AUTH: "{{ vault_redis_password }}"
  register: _repl
  changed_when: false
  no_log: true

- name: 목표 master 결정
  # ⚠ 인벤토리의 redis_initial_role 을 그대로 따르면 안 된다 — 페일오버로 master 가
  #   바뀐 뒤 플레이북을 다시 돌리면 옛 노드를 master 로 되돌려 스플릿을 만든다.
  #   'Sentinel 이 지금 master 라고 말하는 노드'로 수렴하고, Sentinel 이 아직 아무것도
  #   모르는 최초 부트스트랩에서만 인벤토리 초기값을 쓴다.
  ansible.builtin.set_fact:
    _redis_target_master: >-
      {{ (_sentinel_master.stdout_lines | default([]) | first | default('') | trim)
         or hostvars[_redis_initial_master].node_ip }}
  no_log: true

- name: 목표 master 노드를 master 로 확정
  ansible.builtin.command:
    cmd: redis-cli -h 127.0.0.1 -p {{ redis_port }} replicaof no one
  environment:
    REDISCLI_AUTH: "{{ vault_redis_password }}"
  when:
    - node_ip == _redis_target_master
    - "'role:master' not in _repl.stdout"
  no_log: true
  changed_when: true
  register: _promote

- name: 나머지 노드를 목표 master 의 replica 로 연결
  ansible.builtin.command:
    cmd: >-
      redis-cli -h 127.0.0.1 -p {{ redis_port }}
      replicaof {{ _redis_target_master }} {{ redis_port }}
  environment:
    REDISCLI_AUTH: "{{ vault_redis_password }}"
  when:
    - node_ip != _redis_target_master
    # 이미 '목표 master' 를 바라보는 replica 면 건드리지 않는다.
    # 문자열 포함 검사는 IP 접두사가 겹칠 때 오판하므로 정확히 뽑아 비교한다.
    - (_repl.stdout | regex_search('master_host:\S+') | default('', true)) != ('master_host:' ~ _redis_target_master)
  no_log: true
  changed_when: true
  register: _attach

- name: 복제 관계 영속화 (CONFIG REWRITE)
  # 런타임 REPLICAOF 는 메모리에만 남는다. 영속하지 않으면 redis 를 재시작하는 순간
  # 모든 노드가 독립 master 로 돌아가 복제가 통째로 사라진다(실제로 겪은 증상).
  ansible.builtin.command:
    cmd: redis-cli -h 127.0.0.1 -p {{ redis_port }} config rewrite
  environment:
    REDISCLI_AUTH: "{{ vault_redis_password }}"
  when: (_promote is changed) or (_attach is changed)
  no_log: true
  changed_when: true

# --- 검증 --------------------------------------------------------------------
- name: Sentinel 클러스터가 실제로 페일오버 가능한 상태인지 검증
  # ⚠ get-master-addr-by-name 이 값을 준다고 해서 정상이 아니다 — 그 값은 우리가 써 넣은
  #   monitor 설정을 그대로 되읽는 것이라, master 에 접속조차 못 하고 peer 를 하나도
  #   발견하지 못한 상태에서도 통과한다(실제로 그렇게 오탐한 적이 있다).
  #   페일오버가 가능하려면 다음이 모두 성립해야 한다:
  #     · flags 에 s_down/o_down 이 없을 것        (master 에 실제로 붙어 있음)
  #     · num-other-sentinels >= quorum-1          (정족수를 채울 peer 를 발견함)
  #     · num-slaves >= 1                          (승격시킬 후보가 있음)
  block:
    - name: sentinel master 상태 조회
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          redis-cli -h 127.0.0.1 -p {{ redis_sentinel_port }} \
            sentinel master {{ redis_sentinel_master_name }} | paste - -
        executable: /bin/bash
      environment: "{{ _sentinel_cli_env }}"
      register: _sentinel_check
      changed_when: false
      retries: 12
      delay: 5
      until:
        - "'s_down' not in _sentinel_check.stdout"
        - "'o_down' not in _sentinel_check.stdout"
        - ((_sentinel_check.stdout | regex_search('num-other-sentinels\\s+\\d+') | default('x 0', true)).split() | last | int) >= (redis_sentinel_quorum | int - 1)
        - ((_sentinel_check.stdout | regex_search('num-slaves\\s+\\d+') | default('x 0', true)).split() | last | int) >= 1
      no_log: true

    - name: Sentinel 상태 요약
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} sentinel({{ redis_sentinel_master_name }}):
          master={{ (_sentinel_check.stdout | regex_search('(?m)^ip\s+\S+') | default('ip ?', true)).split() | last }}
          peers={{ (_sentinel_check.stdout | regex_search('num-other-sentinels\s+\d+') | default('x ?', true)).split() | last }}
          replicas={{ (_sentinel_check.stdout | regex_search('num-slaves\s+\d+') | default('x ?', true)).split() | last }}

  rescue:
    # no_log 로 원인이 가려지므로, 비밀이 섞이지 않는 진단 정보를 따로 모아 보여준다.
    - name: 진단 — Sentinel 이 실제로 감시 중인 master 이름
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -E '^sentinel monitor ' {{ redis_sentinel_conf }} | awk '{print $3, $4, $5}'
        executable: /bin/bash
      register: _diag_monitor
      changed_when: false
      failed_when: false

    - name: 진단 — sentinel 서비스 상태
      ansible.builtin.command:
        cmd: systemctl is-active redis-sentinel
      register: _diag_svc
      changed_when: false
      failed_when: false

    - name: 진단 — bind 순서 (가장 흔한 원인)
      ansible.builtin.command:
        cmd: grep -E '^bind |^sentinel announce-ip ' {{ redis_sentinel_conf }}
      register: _diag_bind
      changed_when: false
      failed_when: false

    - name: 원인 안내 후 중단
      ansible.builtin.fail:
        msg: >-
          Sentinel 이 페일오버 가능한 상태가 아닙니다.
          서비스={{ _diag_svc.stdout | default('?') }},
          monitor=[{{ _diag_monitor.stdout | default('없음') | trim }}],
          bind/announce=[{{ _diag_bind.stdout | default('?') | replace('\n', ' / ') }}].
          ① bind 첫 주소가 127.0.0.1 이면 원격 연결이 loopback 소스로 나가 전부 실패하고
             자기 자신도 127.0.0.1 로 광고해 peer 발견이 안 된다 → 노드 IP 를 먼저 둘 것.
          ② monitor 이름이 'mymaster' 면 패키지 stock 설정이 남은 것이다
             → -e redis_sentinel_force_rewrite=true 로 재배치.
          ③ 인증 오류면 vault_redis_password 와 sentinel.conf 의 requirepass/auth-pass 불일치.
          상세: /var/log/redis/sentinel.log
